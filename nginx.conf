server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La app usa React Router, asi que cualquier ruta tiene que servir
    # index.html; sin esto, recargar /grupos/g-depto responde 404
    # (CLAUDE.md, seccion 4.1).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
